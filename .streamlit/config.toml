[theme]
base = "light"
primaryColor = "#0072B2"
backgroundColor = "#FCFCFB"
secondaryBackgroundColor = "#F4F3F0"
textColor = "#1A1A18"
font = "sans serif"

[server]
# headless is deliberately NOT set here. On a desktop it must stay false so the
# browser opens by itself; container/CI runs pass --server.headless=true on the
# command line instead.

[browser]
gatherUsageStats = false
